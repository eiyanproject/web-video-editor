# Production stack. Managed by ./install.sh - re-run that script to update.
#
# No media or output bind mounts by default, and no seeded library folders: a
# writable destination nobody chose is how you quietly fill a volume you forgot
# about. Connect a share in Settings instead; it mounts inside the container at
# /mnt/smb/<name>. Everything is persisted to ./config on the host.

# Explicit project name: without it both compose files derive the same name
# from the folder, and starting one treats the other's containers as strays.
name: web-video-editor

services:
  api:
    build:
      context: ./api
    image: web-video-editor-api:latest
    container_name: wve-api
    restart: unless-stopped
    volumes:
      - ./config:/config
      - ./cache:/cache            # ffprobe results, keyframe index, sprite sheets
      # Uncomment to expose a LOCAL folder from the host as well:
      # - /srv/media:/media:ro
    environment:
      VEDITOR_CONFIG: "/config/settings.json"
      VEDITOR_CACHE: "/cache"
      VEDITOR_BIND: "0.0.0.0:8080"
      RUST_LOG: "${RUST_LOG:-veditor_api=info,tower_http=warn}"
    # mount.cifs needs CAP_SYS_ADMIN. If mounting fails on an unusual host,
    # replace these with `privileged: true`.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    # The API is never published to the host: everything reaches it through the
    # ui container, which is the only thing that can apply auth or TLS.
    expose:
      - "8080"
    # Optional: Intel iGPU for faster thumbnail scanning and future preview
    # transcoding. Harmless to leave commented out - trim/join needs no GPU.
    # devices:
    #   - /dev/dri:/dev/dri

  ui:
    build:
      context: ./ui
    image: web-video-editor-ui:latest
    container_name: wve-ui
    restart: unless-stopped
    ports:
      # Port 80 by default so the bare IP works with no port to remember.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Drop fullchain.pem and privkey.pem here to serve real TLS. Absent, port
      # 443 simply is not listened on unless TLS_SELFSIGNED=1.
      - ./certs:/certs:ro
    environment:
      AUTH_USER: "${AUTH_USER:-}"
      AUTH_PASS: "${AUTH_PASS:-}"
      TLS_SELFSIGNED: "${TLS_SELFSIGNED:-0}"
      FORCE_HTTPS: "${FORCE_HTTPS:-0}"
    depends_on:
      - api

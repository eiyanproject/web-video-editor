[package]
name = "veditor-api"
version = "0.1.0"
edition = "2021"
description = "Video Editor WebUI - Phase 0: library browsing and range-served playback"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# Keeps peak build memory down; the WSL VM here is capped at ~3.7 GB.
codegen-units = 16
debug = 1

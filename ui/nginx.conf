server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Video is served here. Buffering a multi-GB range response through
        # nginx's temp files would add a full copy and break seeking latency,
        # so stream it straight through.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        # Range and conditional headers must reach the backend intact - they are
        # what makes <video> seeking work without downloading the whole file.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Exports and probes can take a while.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }
}
